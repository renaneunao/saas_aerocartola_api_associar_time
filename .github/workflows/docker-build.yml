name: Docker Build and Push - Times Receiver

on:
  push:
    branches: [ main, master ]
    paths:
      - '**/*.py'
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'docker-compose.yml'
      - '.github/workflows/docker-build.yml'
      - 'entrypoint.sh'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: renaneunao
        password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
    
    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: renaneunao/saas-cartola-times-receiver
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha,prefix={{branch}}-
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64
    
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -Eeuo pipefail
          cd /root/apps/cartola-aero/cartola-aero-times-receiver

          SERVICE="times-receiver"
          CONTAINER="cartola-aero-times-receiver-container"
          IMAGE="renaneunao/saas-cartola-times-receiver:latest"
          HEALTH_TIMEOUT=120
          HEALTH_URL="http://127.0.0.1:5000/health"
          PREVIOUS_IMAGE="$(docker inspect --format '{{.Image}}' "$CONTAINER" 2>/dev/null || true)"

          rollback() {
            exit_code=$?
            trap - EXIT
            if [ "$exit_code" -ne 0 ]; then
              echo "Deployment validation failed; rolling back."
              docker compose rm -sf "$SERVICE" || true
              if [ -n "$PREVIOUS_IMAGE" ]; then
                docker tag "$PREVIOUS_IMAGE" "$IMAGE"
                docker compose up -d --no-deps --force-recreate "$SERVICE" || true
                echo "Rollback completed using image $PREVIOUS_IMAGE."
              else
                echo "No previous container image was found; rollback is unavailable."
              fi
            fi
            exit "$exit_code"
          }
          trap rollback EXIT

          docker compose pull "$SERVICE"
          NEW_IMAGE="$(docker image inspect --format '{{.Id}}' "$IMAGE")"
          test -n "$NEW_IMAGE"
          echo "Pulled image $NEW_IMAGE; the current container was left running until this point."

          docker compose up -d --no-deps --force-recreate "$SERVICE"

          HEALTHY=0
          DEADLINE=$((SECONDS + HEALTH_TIMEOUT))
          while (( SECONDS < DEADLINE )); do
            STATE="$(docker inspect --format '{{.State.Status}}' "$CONTAINER" 2>/dev/null || true)"
            if [ "$STATE" = "exited" ] || [ "$STATE" = "dead" ]; then
              docker logs --tail 80 "$CONTAINER" || true
              exit 1
            fi
            if [ "$STATE" = "running" ]; then
              HEALTH="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CONTAINER")"
              if [ "$HEALTH" = "healthy" ]; then
                HEALTHY=1
                break
              elif [ "$HEALTH" = "unhealthy" ]; then
                docker logs --tail 80 "$CONTAINER" || true
                exit 1
              elif [ "$HEALTH" = "none" ] && [ -n "$HEALTH_URL" ]; then
                if docker exec "$CONTAINER" python -c "import urllib.request; urllib.request.urlopen('$HEALTH_URL', timeout=5)" >/dev/null 2>&1; then
                  HEALTHY=1
                  break
                fi
              elif [ "$HEALTH" = "none" ]; then
                STABLE_UNTIL=$((SECONDS + 15))
                while (( SECONDS < STABLE_UNTIL )); do
                  [ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER" 2>/dev/null || true)" = "running" ] || exit 1
                  sleep 5
                done
                HEALTHY=1
                break
              fi
            fi
            sleep 5
          done

          [ "$HEALTHY" -eq 1 ]
          trap - EXIT
          echo "Times Receiver deployed and validated successfully!"

    - name: Verify deployment
      run: |
        echo "Docker image built and pushed successfully to Docker Hub!"
        echo "Image digest: ${{ steps.meta.outputs.digest }}"
