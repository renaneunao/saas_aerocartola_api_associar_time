name: Docker Build and Deploy - Associar Time Gateway

on:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: renaneunao
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: renaneunao/saas-cartola-associar-time-gateway
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push gateway image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Copy production compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yml
          target: /root/apps/cartola-aero/cartola-aero-times-receiver

      - name: Deploy and validate on Oracle
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -Eeuo pipefail

            APP_DIR="/root/apps/cartola-aero/cartola-aero-times-receiver"
            WEB_DIR="/root/apps/cartola-aero/cartola-aero-web-app"
            SERVICE="times-receiver"
            CONTAINER="cartola-aero-times-receiver-container"
            IMAGE="renaneunao/saas-cartola-associar-time-gateway:latest"
            HEALTH_TIMEOUT=180

            cd "$APP_DIR"

            if [ ! -f .env ]; then
              cp "$WEB_DIR/.env" .env
            fi

            upsert_env() {
              file="$1"
              key="$2"
              value="$3"
              touch "$file"
              if grep -q "^${key}=" "$file"; then
                sed -i "s#^${key}=.*#${key}=${value}#" "$file"
              else
                printf '\n%s=%s\n' "$key" "$value" >> "$file"
              fi
            }

            GATEWAY_SECRET="$(grep '^GATEWAY_SHARED_SECRET=' .env | head -1 | cut -d= -f2- || true)"
            if [ -z "$GATEWAY_SECRET" ]; then
              GATEWAY_SECRET="$(openssl rand -hex 32)"
            fi

            upsert_env .env GATEWAY_SHARED_SECRET "$GATEWAY_SECRET"
            upsert_env .env GLOBO_VERIFY_TLS "1"

            # O web app usa o mesmo segredo e chama o gateway somente pela rede Docker.
            upsert_env "$WEB_DIR/.env" ASSOCIAR_TIME_GATEWAY_URL "http://cartola-aero-associar-gateway:5001"
            upsert_env "$WEB_DIR/.env" ASSOCIAR_TIME_GATEWAY_SECRET "$GATEWAY_SECRET"
            upsert_env "$WEB_DIR/.env" ASSOCIAR_TIME_GATEWAY_TIMEOUT "180"
            if ! grep -q '^GLOBO_HCAPTCHA_SITEKEY=' "$WEB_DIR/.env"; then
              upsert_env "$WEB_DIR/.env" GLOBO_HCAPTCHA_SITEKEY "a94854c7-ad52-4d8e-864a-542dde743c65"
            fi

            # O compose do web app é mantido no servidor; garanta que ele passe as variáveis novas.
            if ! grep -q 'ASSOCIAR_TIME_GATEWAY_URL' "$WEB_DIR/docker-compose.yml"; then
              sed -i '/^[[:space:]]*DOMAIN:/a\      ASSOCIAR_TIME_GATEWAY_URL: ${ASSOCIAR_TIME_GATEWAY_URL:-http://cartola-aero-associar-gateway:5001}\n      ASSOCIAR_TIME_GATEWAY_SECRET: ${ASSOCIAR_TIME_GATEWAY_SECRET}\n      ASSOCIAR_TIME_GATEWAY_TIMEOUT: ${ASSOCIAR_TIME_GATEWAY_TIMEOUT:-180}\n      GLOBO_HCAPTCHA_SITEKEY: ${GLOBO_HCAPTCHA_SITEKEY}' "$WEB_DIR/docker-compose.yml"
            fi

            docker compose pull "$SERVICE"
            docker compose up -d --no-deps --force-recreate "$SERVICE"

            HEALTHY=0
            DEADLINE=$((SECONDS + HEALTH_TIMEOUT))
            while (( SECONDS < DEADLINE )); do
              STATE="$(docker inspect --format '{{.State.Status}}' "$CONTAINER" 2>/dev/null || true)"
              if [ "$STATE" = "exited" ] || [ "$STATE" = "dead" ]; then
                docker logs --tail 100 "$CONTAINER" || true
                exit 1
              fi
              if [ "$STATE" = "running" ]; then
                HEALTH="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CONTAINER")"
                if [ "$HEALTH" = "healthy" ]; then
                  HEALTHY=1
                  break
                elif [ "$HEALTH" = "unhealthy" ]; then
                  docker logs --tail 100 "$CONTAINER" || true
                  exit 1
                fi
              fi
              sleep 5
            done

            test "$HEALTHY" -eq 1
            docker inspect "$CONTAINER" --format 'gateway={{.State.Health.Status}} network={{json .NetworkSettings.Networks}}'
            echo "Associar Time Gateway deployed and healthy."

      - name: Verify build
        run: |
          echo "Gateway image published: ${{ steps.meta.outputs.version }}"
